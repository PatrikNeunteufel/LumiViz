# MyViz GPU Configuration
#
# This file controls which GPU is preferred for rendering.
#
# Options:
#   PreferHighPerformance = true/false
#       If true, prefer dedicated GPU over integrated
#
#   PreferredVendor = NVIDIA / AMD / Intel
#       Prefer GPUs from this vendor (optional)
#
#   PreferredName = <partial name>
#       Prefer GPU whose name contains this string (optional)
#       Example: PreferredName=RTX 4090
#

[GPU]
PreferHighPerformance=true
# PreferredVendor=NVIDIA
# PreferredName=RTX
